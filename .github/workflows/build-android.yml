name: Build DSH Mobile APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd app
        npm install
        npm install -g @capacitor/cli @capacitor/core

    - name: Prepare web assets
      run: |
        mkdir -p app/www
        cp app/index.html app/www/
        cp app/capacitor.config.json app/www/

    - name: Initialize Capacitor
      run: |
        cd app
        npx cap init "DSH Mobile" "com.deepseek.harness.mobile" --web-dir www

    - name: Sync Capacitor
      run: |
        cd app
        npx cap add android
        npx cap sync

    - name: Build APK
      run: |
        cd app/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DSH-Mobile-APK
        path: app/android/app/build/outputs/apk/debug/app-debug.apk
